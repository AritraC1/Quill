global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "quill-server"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["server:3000", "host.docker.internal:3000"]
        labels:
          service: "quill-server"
          env: "development"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

