# Continuous integration — typecheck (strict, repo root), unit tests and a
# production build of the client. Runs on every push/PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (root, strict)
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Build client
        run: bun --filter quill-client build
