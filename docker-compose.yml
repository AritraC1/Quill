services:
  postgres:
    image: postgres:16-alpine
    container_name: quill-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quill_secret}
      POSTGRES_DB: ${POSTGRES_DB:-quill_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/server/src/core/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quill}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quill-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: production
    container_name: quill-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-quill}:${POSTGRES_PASSWORD:-quill_secret}@postgres:5432/${POSTGRES_DB:-quill_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}   # must be ≥32 chars — do NOT use quill_jwt_secret_dev (too short)
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM: ${EMAIL_FROM:-Quill <beth.t@example.com>}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: production
    container_name: quill-worker
    restart: unless-stopped
    command: ["bun", "src/worker.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-quill}:${POSTGRES_PASSWORD:-quill_secret}@postgres:5432/${POSTGRES_DB:-quill_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}   # must be ≥32 chars — do NOT use quill_jwt_secret_dev (too short)
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM: ${EMAIL_FROM:-Quill <beth.t@example.com>}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      target: production
    container_name: quill-client
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - internal
    depends_on:
      - server

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  uploads_data:
