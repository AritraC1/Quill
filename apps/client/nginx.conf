server {
    listen 80;
    server_name localhost;

    # Serve React SPA static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to Express backend
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Reverse proxy Swagger documentation
    location /docs/ {
        proxy_pass http://server:3000/docs/;
        proxy_set_header Host $host;
    }

    # Health and Prometheus metrics endpoints
    location /health {
        proxy_pass http://server:3000/health;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://server:3000/metrics;
        proxy_set_header Host $host;
    }

    # Uploaded media (avatars) served by Express
    location /uploads/ {
        proxy_pass http://server:3000/uploads/;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
